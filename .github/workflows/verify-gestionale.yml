name: Verifica gestionale e archivio preventivi

on:
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "scripts/test-pdfSuperati.mjs"
      - "scripts/riordinaCartellePreventivi.mjs"
      - "scripts/test-riordinaCartellePreventivi.mjs"
      - "scripts/test-identificativiPreventivi.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-gestionale.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "src/**"
      - "scripts/test-pdfSuperati.mjs"
      - "scripts/riordinaCartellePreventivi.mjs"
      - "scripts/test-riordinaCartellePreventivi.mjs"
      - "scripts/test-identificativiPreventivi.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-gestionale.yml"

jobs:
  verifica:
    name: Build e storico preventivi
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v4
      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installa dipendenze da lockfile
        run: npm ci
      - name: Test cartella Superati e riordino preventivi
        run: |
          node --test scripts/test-pdfSuperati.mjs
          node --test scripts/test-identificativiPreventivi.mjs
          node --test scripts/test-riordinaCartellePreventivi.mjs
      - name: Controlla sintassi backend
        run: |
          node --check server/routes/preventivi.js
          node --check server/routes/systemSettings.js
          node --check server/utils/archivioRoot.js
          node --check server/utils/preventivoPdf.js
          node --check server/utils/pdfSuperati.js
          node --check scripts/riordinaCartellePreventivi.mjs
      - name: Compila frontend
        run: npm run build
